AWSTemplateFormatVersion: "2010-09-09"
Description: FinDoc AI - one small EC2 server, its firewall, and a fixed public IP. Deleting the stack removes everything.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: The key pair you created (findoc-key).
  MyIp:
    Type: String
    Description: Your own IP address followed by /32, for example 203.0.113.7/32. Only this address can SSH in.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/32$'
    ConstraintDescription: must be your IPv4 address followed by /32, for example 203.0.113.7/32.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, c7i-flex.large, m7i-flex.large]
    Description: t3.small makes the credits last. The larger two are faster but use credits much sooner.

Resources:
  Firewall:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FinDoc AI - web for everyone, SSH for the owner
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP (redirects to HTTPS) }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref MyIp, Description: SSH from the owner only }

  # "Latest Ubuntu" is resolved by EC2 at launch, not by CloudFormation. With the
  # usual SSM parameter type, updating the stack later (say, for a new MyIp) could
  # pick up a newer image and replace the running server with an empty one.
  Launch:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs: { VolumeType: gp3, VolumeSize: 30, Encrypted: true, DeleteOnTermination: true }

  Server:
    Type: AWS::EC2::Instance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref Launch
        Version: "1"
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds: [!GetAtt Firewall.GroupId]
      Tags:
        - { Key: Name, Value: findoc-ai }

  Address:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref Server
      Tags:
        - { Key: Name, Value: findoc-ai }

Outputs:
  ServerIp:
    Description: Put this IP in DuckDNS, and pass it to deploy.ps1 as -Server.
    Value: !Ref Address
